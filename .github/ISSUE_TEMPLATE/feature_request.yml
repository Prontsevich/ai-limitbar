name: Feature request
description: Suggest a public product improvement
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem and desired outcome without including private provider or account data.

        This issue is public. Do not include credentials, tokens, cookies, raw provider responses, private account identifiers, personal data, or confidential roadmap information.
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What is difficult today, and who would benefit from improving it?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe the behavior or result you would find useful. A complete implementation design is not required.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround or alternatives
      description: Explain how you handle this today, if applicable.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that this public issue contains no credentials, tokens, cookies, raw provider responses, private account identifiers, personal data, or confidential planning details.
          required: true
