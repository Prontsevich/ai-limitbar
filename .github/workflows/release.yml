name: Release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Package {0}', inputs.version) || format('Release {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in MAJOR.MINOR.PATCH format
        required: true
        default: 0.2.0
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package application
    runs-on: macos-26
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact: ${{ steps.version.outputs.artifact }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${REF_NAME#v}"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "error: release tag must point to a commit contained in main" >&2
              exit 1
            fi
          else
            version="$INPUT_VERSION"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "error: version must use MAJOR.MINOR.PATCH with numeric components" >&2
            exit 2
          fi

          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "artifact=AILimitBar-$version-packages" >>"$GITHUB_OUTPUT"

      - name: Report toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Build release archives
        run: |
          ./script/package_release.sh "${{ steps.version.outputs.version }}" arm64
          ./script/package_release.sh "${{ steps.version.outputs.version }}" x86_64

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.version.outputs.artifact }}
          path: |
            dist/AILimitBar-${{ steps.version.outputs.version }}-arm64.zip
            dist/AILimitBar-${{ steps.version.outputs.version }}-x86_64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download verified package
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          VERSION: ${{ needs.package.outputs.version }}
          RELEASE_NOTES: |
            Requires macOS 15 or later.

            Download the `-arm64.zip` archive for Apple Silicon Macs or the
            `-x86_64.zip` archive for Intel Macs.

            Download the ZIP, move AILimitBar.app to Applications, and open it.
            This build is ad-hoc signed and is not notarized by Apple. If macOS
            blocks the first launch, use System Settings > Privacy & Security >
            Open Anyway only if you trust this GitHub release.
        run: |
          gh release create "$TAG_NAME" \
            "dist/AILimitBar-$VERSION-arm64.zip" \
            "dist/AILimitBar-$VERSION-x86_64.zip" \
            --verify-tag \
            --generate-notes \
            --title "AI Limitbar $VERSION" \
            --notes "$RELEASE_NOTES"
