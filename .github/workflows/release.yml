name: Release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch' && format('Distribution gate {0}', inputs.version) || format('Distribution gate {0}', github.ref_name) }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version in MAJOR.MINOR.PATCH format
        required: true
        default: 0.2.0
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trusted-distribution-gate:
    name: Trusted distribution is disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Block unsigned or unnotarized publication
        run: |
          echo "::error::Trusted distribution is disabled until protected CI signing, notarization, stapling, and Gatekeeper validation are configured."
          echo "The local Developer ID packaging script is for authorized local validation only."
          exit 1
